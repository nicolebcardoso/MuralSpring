<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title th:text="#{titulo.mural}"></title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:insert="~{cabecalho :: siteHeader}"></div>

<h1 th:text="#{titulo.postar}"></h1>

<ul>

    <li>
        <a th:href="@{/}"
           th:text="#{menu.home}">
        </a>
    </li>

    <li>
        <a th:href="@{/mensagens}"
           th:text="#{menu.verMensagens}">
        </a>
    </li>

    <li>
        <a th:href="@{/logout}"
           th:text="#{menu.logout}">
        </a>
    </li>

</ul>

<form
        th:action="@{/postar}"
        th:object="${sendMessageForm}"
        method="post">

    <label for="from"
           th:text="#{label.from}">
    </label>

    <br>

    <input type="text" th:field="*{from}">

    <br>

    <div
            th:if="${#fields.hasErrors('from')}"
            th:errors="*{from}"
            class="error-message">
    </div>

    <br>

    <label for="to"
           th:text="#{label.to}">
    </label>

    <br>

    <input type="text" th:field="*{to}">

    <br>

    <div
            th:if="${#fields.hasErrors('to')}"
            th:errors="*{to}"
            class="error-message">
    </div>

    <br>

    <label for="message"
           th:text="#{label.message}">
    </label>

    <br>

    <textarea
            th:field="*{message}"
            rows="6"
            cols="40">
    </textarea>

    <br>

    <div
            th:if="${#fields.hasErrors('message')}"
            th:errors="*{message}"
            class="error-message">
    </div>

    <br>

    <div th:if="${#fields.hasGlobalErrors()}">

        <div
                th:each="err : ${#fields.globalErrors()}"
                class="error-message"
                th:text="${err}">
        </div>

    </div>

    <button type="submit"
            th:text="#{botao.enviar}">
    </button>

</form>

</body>
</html>
